[project]
name = "upstream-signals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "feedparser>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["upstream", "upstream.collectors"]

[tool.setuptools.package-data]
"upstream.collectors" = ["feeds.txt"]
